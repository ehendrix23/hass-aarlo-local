name: Validate integration
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Install locked test environment
        run: uv sync --project ha-test --locked --python 3.14.2
      - name: Install test executables
        run: |
          mkdir -p ha-test/bin
          curl --fail --location --retry 3 --output ha-test/bin/go2rtc https://github.com/AlexxIT/go2rtc/releases/download/v1.9.13/go2rtc_linux_amd64
          echo 'dce491325c28890ad0b85e83090753dc111b903ef83f43b834798f9114520dba  ha-test/bin/go2rtc' | sha256sum --check
          chmod +x ha-test/bin/go2rtc
          ln -s "$(ha-test/.venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ha-test/bin/ffmpeg
      - name: Validate package and run quality gates
        run: |
          uv run --project ha-test --no-sync --with coverage==7.17.5 --with mypy==2.4.1 --with types-psutil==7.2.2.20261122 --with ruff==0.14.10 sh -ec '
            python scripts/validate_package.py
            python ha-test/regression.py
            python -m mypy --config-file mypy.ini
            ruff check custom_components/arlo_local scripts
            ruff format --check custom_components/arlo_local scripts
          '
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235
  core-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test against the actual released Core image (amd64)
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/checkout:ro" --entrypoint /bin/sh \
            ghcr.io/home-assistant/amd64-homeassistant@sha256:fbbd521bd989893b6c350877d17e1eb1126b6a1bfb715c28e6945f1c82ae0093 -ec '
              python -c "from importlib.metadata import version; assert version(\"homeassistant\") == \"2026.11.3\""
              go2rtc --version
              ffmpeg -version
              ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264
              uv pip install --system --constraint /usr/src/homeassistant/homeassistant/package_constraints.txt pyaarlo==0.8.0.27 coverage==7.17.5
              mkdir -p /tmp/arlo-test
              cp -R /checkout/custom_components /checkout/tests /checkout/ha-test /checkout/scripts /checkout/hacs.json /checkout/README.md /tmp/arlo-test/
              cd /tmp/arlo-test
              mkdir -p ha-test/bin
              ln -s "$(command -v go2rtc)" ha-test/bin/go2rtc
              ln -s "$(command -v ffmpeg)" ha-test/bin/ffmpeg
              python scripts/validate_package.py
              python ha-test/regression.py
            '
